server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 리버스 프록시(TLS 종료) 뒤에서 nginx가 http:// 절대 주소로 리다이렉트하면
    # https → http → https 로 두 번 돌게 된다. Location을 상대 경로로 보낸다.
    absolute_redirect off;

    # nginx add_header는 location이 자기 add_header를 따로 선언하면 부모(server)
    # 쪽 add_header를 상속하지 않고 통째로 무시한다. /assets/, /version.json은
    # 각자 Cache-Control을 따로 선언하므로 그 location들에도 이 include를
    # 반복해서 보안 헤더가 누락되지 않게 한다.
    include /etc/nginx/security-headers.conf;

    # 해시 붙은 정적 자산은 장기 캐시
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — 단, /api는 프런트가 아님을 명시 (백엔드는 api.mju-craft.shop 직접 호출)
    location /api/ {
        return 404;
    }

    # 배포 스모크 체크가 실제 배포된 커밋 SHA를 확인하는 용도라 캐시되면 안 된다.
    location = /version.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 애플리케이션 화면은 크롤링 대상이 아니다. robots.txt의 Disallow는 URL의
    # 색인을 보장하지 않으므로 응답 헤더도 함께 보낸다.
    location ~ ^/(?:admin|cart|order|orders|mypage|login|apply|feedback|payouts)(?:/|$) {
        include /etc/nginx/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/index.html /index.html;
    }

    # prerender가 /projects/48/index.html 처럼 디렉터리로 만들므로, $uri/를 쓰면
    # /projects/48 요청에 슬래시를 붙이는 301이 생긴다. index.html을 바로 내려준다.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
