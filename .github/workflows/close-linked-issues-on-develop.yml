name: Close Linked Issues on Develop

on:
  pull_request:
    branches: ["develop"]
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close issues linked with closing keywords
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          mapfile -t ISSUE_NUMBERS < <(
            printf '%s' "$PR_BODY" |
              perl -nE 'while (/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#([0-9]+)/ig) { say $1 }' |
              sort -u
          )

          if [[ "${#ISSUE_NUMBERS[@]}" -eq 0 ]]; then
            echo "No linked issues found."
            exit 0
          fi

          for ISSUE_NUMBER in "${ISSUE_NUMBERS[@]}"; do
            IS_PULL_REQUEST="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq 'has("pull_request")')"

            if [[ "$IS_PULL_REQUEST" == "true" ]]; then
              echo "Skipping #$ISSUE_NUMBER because it is a pull request."
              continue
            fi

            gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              --method POST \
              --field body="PR #$PR_NUMBER가 develop에 머지되어 이슈를 자동 종료합니다."

            gh api "repos/$REPO/issues/$ISSUE_NUMBER" \
              --method PATCH \
              --field state=closed \
              --field state_reason=completed

            echo "Closed issue #$ISSUE_NUMBER."
          done
