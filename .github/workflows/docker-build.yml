name: Docker Build Check

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Docker 이미지 빌드 검증 (push 없음)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
