version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # 메이저 버전 업데이트는 호환성이 깨질 수 있어 자동 PR 대상에서 제외한다.
    # 필요하면 직접 버전을 확인하고 개별적으로 업데이트한다.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # 서로 버전이 어긋나면 안 되는(또는 항상 같이 다니는) 패키지들은 묶어서
    # 하나의 PR로만 올라오게 한다. react와 react-dom이 따로 올라가서
    # 버전이 어긋나 프로덕션이 죽었던 사고(2026-07) 재발 방지.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      tanstack-query:
        patterns:
          - "@tanstack/react-query*"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      eslint-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Dockerfile base image(node, nginx)도 메이저 버전은 자동 반영 대상에서 제외.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
